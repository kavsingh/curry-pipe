pre-commit:
  jobs:
    - run: pnpm oxfmt {staged_files}
      glob: "**/*.{ts,js,json,jsonc,toml,yaml,yml}"
      stage_fixed: true
    - run: pnpm oxlint --fix {staged_files}
      glob: "**/*.{ts,js}"
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - run: pnpm lint
      glob: "**/*.*"
